<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>linktree</title>
<style>
  :root {
    --ink: #f3ecdc;
    --muted: #bdb3a0;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.13);
    --accent: #e0b6ae;
    --rose: #a96f6f;
    --gold: #c8a25a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 20px;
    overflow-x: hidden;
    background: #100e0c;
  }

  /* --- animated aurora background --- */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    mix-blend-mode: screen;
    animation: drift 18s ease-in-out infinite alternate;
  }

  .blob.a {
    width: 480px; height: 480px;
    background: #a96f6f;
    top: -120px; left: -120px;
  }

  .blob.b {
    width: 420px; height: 420px;
    background: #b08c52;
    bottom: -140px; right: -100px;
    animation-delay: -6s;
  }

  .blob.c {
    width: 360px; height: 360px;
    background: #8b6f7a;
    top: 40%; left: 55%;
    animation-delay: -12s;
    opacity: 0.4;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(60px, -40px) scale(1.15); }
    100% { transform: translate(-40px, 50px) scale(0.95); }
  }

  /* subtle grain */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.5;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 4px 4px;
  }

  /* blurred cover backdrop */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: url("nme_cover.jpg") center 25% / cover no-repeat;
    filter: blur(30px) brightness(0.4) saturate(1.15);
    opacity: 0.55;
  }

  /* --- card --- */
  main {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    padding: 40px 28px 32px;
    border-radius: 28px;
    background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    border: 1px solid var(--glass-border);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(18px) saturate(140%);
    text-align: center;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(28px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* avatar */
  .avatar {
    width: 96px;
    height: 96px;
    margin: 0 auto 16px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 0deg, #a96f6f, #c8a25a, #8b6f7a, #a96f6f);
    animation: spin 8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #1a1427;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .username {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 4px 0 0;
  }

  .bio {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
    margin: 14px auto 26px;
    max-width: 320px;
  }

  /* links */
  .links { display: flex; flex-direction: column; gap: 12px; }

  .link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-radius: 100px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 600;
    font-size: 0.95rem;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .link::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }

  .link:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.28);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  }

  .link:hover::before { transform: translateX(100%); }

  .link .icon {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
  }

  .link .icon svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .link span.label { flex: 1; text-align: left; }

  .link .arrow {
    opacity: 0;
    transform: translateX(-6px);
    transition: all 0.25s ease;
  }

  .link:hover .arrow { opacity: 1; transform: translateX(0); }

  footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.75rem;
    opacity: 0.7;
  }

  /* --- login overlay --- */
  .login-screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 48px 20px;
    background: rgba(11, 9, 20, 0.65);
    backdrop-filter: blur(10px);
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  .login-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    padding: 40px 32px 32px;
    border-radius: 28px;
    background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    border: 1px solid var(--glass-border);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(18px) saturate(140%);
    text-align: center;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .login-card .lock {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #a96f6f, #c8a25a);
    box-shadow: 0 0 30px rgba(169, 111, 111, 0.45);
  }

  .login-card .lock svg { width: 26px; height: 26px; fill: #fff; }

  .login-card h2 { font-size: 1.2rem; margin-bottom: 4px; }

  .login-card p.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }

  .field {
    margin-bottom: 14px;
    text-align: left;
  }

  .field label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .field input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--ink);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201, 182, 255, 0.18);
  }

  .btn-login {
    width: 100%;
    margin-top: 6px;
    padding: 14px;
    border: none;
    border-radius: 100px;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(90deg, #a96f6f, #c8a25a);
    background-size: 200% 100%;
    background-position: 0% 0;
    transition: background-position 0.4s ease, transform 0.2s ease, box-shadow 0.3s ease;
  }

  .btn-login:hover {
    background-position: 100% 0;
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(169, 111, 111, 0.4);
  }

  .error {
    min-height: 20px;
    margin-top: 12px;
    font-size: 0.8rem;
    color: #ff8fa3;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .error.show { opacity: 1; }

  /* logout button */
  .logout {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 5;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 100px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--ink);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: background 0.25s ease, transform 0.25s ease;
  }

  .logout svg { width: 14px; height: 14px; fill: currentColor; }

  .logout:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); }

  /* --- link management (admin) --- */
  .link-row { position: relative; }

  .link-actions {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%) scale(0.9);
    display: flex;
    gap: 6px;
    opacity: 0;
    z-index: 3;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .is-auth .link-row:hover .link-actions {
    opacity: 1;
    transform: translateY(-50%) scale(1);
  }

  .link-actions button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: rgba(20, 16, 35, 0.85);
    color: var(--ink);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .link-actions button:hover { background: #a96f6f; transform: scale(1.1); }
  .link-actions button.del:hover { background: #8a2f2f; }
  .link-actions svg { width: 14px; height: 14px; fill: currentColor; }

  .is-auth .link .arrow { display: none; }

  .add-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px;
    border-radius: 100px;
    border: 1.5px dashed var(--glass-border);
    background: transparent;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .add-link:hover {
    border-color: var(--accent);
    color: var(--ink);
    background: rgba(255, 255, 255, 0.05);
  }

  .add-link svg { width: 16px; height: 16px; fill: currentColor; }

  /* --- modal --- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(11, 9, 20, 0.7);
    backdrop-filter: blur(10px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }

  .modal-backdrop.open { opacity: 1; visibility: visible; }

  .modal {
    width: 100%;
    max-width: 400px;
    padding: 28px;
    border-radius: 24px;
    background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
    border: 1px solid var(--glass-border);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(18px) saturate(140%);
    animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    text-align: left;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .modal-head h3 { font-size: 1.15rem; }

  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .modal-close:hover { background: rgba(255, 255, 255, 0.14); color: var(--ink); }
  .modal-close svg { width: 14px; height: 14px; fill: currentColor; }

  .modal select {
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--ink);
    font-size: 0.95rem;
    outline: none;
    appearance: none;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  .modal select option { background: #1a1427; color: var(--ink); }

  .modal select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201, 182, 255, 0.18);
  }

  .modal-note { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }

  .modal-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-ghost {
    flex: 1;
    padding: 13px;
    border-radius: 100px;
    border: 1px solid var(--glass-border);
    background: transparent;
    color: var(--ink);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.25s ease;
  }

  .btn-ghost:hover { background: rgba(255, 255, 255, 0.1); }

  .btn-danger {
    background: linear-gradient(90deg, #8a2f2f, #b04a4a);
  }

  .btn-danger:hover {
    background-position: 100% 0;
    box-shadow: 0 12px 30px rgba(176, 74, 74, 0.45);
  }
</style>
</head>
<body>
  <div class="aurora">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
  </div>
  <div class="grain"></div>

  <button class="logout" id="logoutBtn" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 1a11 11 0 1 0 0 22 11 11 0 0 0 0-22zm-4 9h5.2l-1.6-1.6 1.4-1.4 4 4-4 4-1.4-1.4L13.2 12H8v-2zm12.2 2h1.6A11.9 11.9 0 0 1 12 24V11z"/></svg>
    Logout
  </button>

  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="lock">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zM9 8V6a3 3 0 0 1 6 0v2H9z"/></svg>
      </div>
      <h2>Welcome back</h2>
      <p class="sub">Sign in to view this page</p>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="Enter username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" />
      </div>
      <button class="btn-login" id="loginBtn">Sign in</button>
      <p class="error" id="errorMsg">Invalid username or password</p>
    </div>
  </div>

  <main id="profile" hidden>
    <div class="avatar"><img src="no_avatar.jpg" alt="profile picture" /></div>
    <h1>Zaurus</h1>
    <p class="username">@NMEgeekfan</p>
    <p class="bio">Chopin is my comfort music composer.</p>

    <div class="links" id="links"></div>
    <div style="margin-top: 16px;">
      <button class="add-link" id="addLinkBtn" hidden>
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add link
      </button>
    </div>

    <footer>designed with &#9834; by zaurus</footer>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Add link</h3>
        <button class="modal-close" id="modalClose">
          <svg viewBox="0 0 24 24"><path d="M18.7 5.3a1 1 0 0 0-1.4 0L12 10.6 6.7 5.3a1 1 0 0 0-1.4 1.4L10.6 12l-5.3 5.3a1 1 0 0 0 1.4 1.4L12 13.4l5.3 5.3a1 1 0 0 0 1.4-1.4L13.4 12l5.3-5.3a1 1 0 0 0 0-1.4z"/></svg>
        </button>
      </div>
      <div id="modalFields">
        <div class="field">
          <label for="mLabel">Label</label>
          <input id="mLabel" type="text" placeholder="e.g. My Portfolio" />
        </div>
        <div class="field">
          <label for="mUrl">URL</label>
          <input id="mUrl" type="url" placeholder="https://example.com" />
        </div>
        <div class="field">
          <label for="mIcon">Icon</label>
          <select id="mIcon">
            <option value="link">Link</option>
            <option value="github">GitHub</option>
            <option value="instagram">Instagram</option>
            <option value="linkedin">LinkedIn</option>
            <option value="x">Twitter / X</option>
            <option value="youtube">YouTube</option>
            <option value="behance">Behance</option>
          </select>
        </div>
      </div>
      <p class="modal-note" id="modalNote" hidden></p>
      <div class="modal-row">
        <button class="btn-ghost" id="modalCancel">Cancel</button>
        <button class="btn-login" id="modalSave">Add</button>
      </div>
    </div>
  </div>

<script>
  const USERNAME = "NMEgeekfan";
  const PASSWORD = "NOMOREEURYDICE";
  const SESSION_KEY = "linktree_auth";
  const LINKS_KEY = "linktree_links";

  const DEFAULTS = [
    { icon: "github",    label: "GitHub",       url: "#" },
    { icon: "instagram", label: "Instagram",    url: "#" },
    { icon: "linkedin",  label: "LinkedIn",     url: "#" },
    { icon: "x",         label: "Twitter / X",  url: "#" },
    { icon: "youtube",   label: "YouTube",      url: "#" },
    { icon: "behance",   label: "Behance",      url: "#" }
  ];

  const ICONS = {
    link: '<svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 1 1-1.4-1.4l4-4a1 1 0 1 1 1.4 1.4zm7.1-7.1-1.4-1.4a1 1 0 1 1 1.4-1.4l1.4 1.4a1 1 0 1 1-1.4 1.4zm-10.5 10.5-1.4-1.4a1 1 0 1 0-1.4 1.4l1.4 1.4a1 1 0 1 0 1.4-1.4zm3.6 2.6-4.4-4.4a1 1 0 0 1 1.5-1.3l4.2 4.2-1.3 1.5z"/></svg>',
    github: '<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12c0 5.3 3.4 9.8 8.2 11.4.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17 4.5 18 4.8 18 4.8c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.8-1.6 8.2-6.1 8.2-11.4C24 5.4 18.6 0 12 0z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.1-1.1.1-1.5.2-1.9.3-.5.2-.8.4-1.1.7-.3.3-.5.6-.7 1.1-.1.4-.2.8-.3 1.9-.1 1.2-.1 1.6-.1 4.7s0 3.5.1 4.7c.1 1.1.2 1.5.3 1.9.2.5.4.8.7 1.1.3.3.6.5 1.1.7.4.1.8.2 1.9.3 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1.1-.1 1.5-.2 1.9-.3.5-.2.8-.4 1.1-.7.3-.3.5-.6.7-1.1.1-.4.2-.8.3-1.9.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1.1-.2-1.5-.3-1.9-.2-.5-.4-.8-.7-1.1-.3-.3-.6-.5-1.1-.7-.4-.1-.8-.2-1.9-.3-1.2-.1-1.6-.1-4.7-.1zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0 9.8a3.8 3.8 0 1 0 0-7.6 3.8 3.8 0 0 0 0 7.6zM19.6 5.5a1.4 1.4 0 1 1-2.8 0 1.4 1.4 0 0 1 2.8 0z"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24"><path d="M20.4 20.4H3.6A1.6 1.6 0 0 1 2 18.8V5.2A1.6 1.6 0 0 1 3.6 3.6h16.8A1.6 1.6 0 0 1 22 5.2v13.6a1.6 1.6 0 0 1-1.6 1.6zM4.6 8.6v10.2h2.2V8.6H4.6zm4.4 0v10.2h2.2v-5.3c0-1.7.7-2.8 2.2-2.8s1.9 1.1 1.9 2.8v5.3h2.2V13c0-2.6-1.4-4-3.6-4s-2.7 1.5-2.7 1.5V8.6H9zm-1.1-2.5a1.2 1.2 0 1 0-2.3 0 1.2 1.2 0 0 0 2.3 0z"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M23.5 4.6c-.9.4-1.8.6-2.8.8a4.9 4.9 0 0 0-8.4 4.4A13.9 13.9 0 0 1 1.7 3.2a4.9 4.9 0 0 0 1.5 6.5c-.7 0-1.5-.2-2.1-.5a4.9 4.9 0 0 0 3.9 4.8c-.7.2-1.4.2-2.1.1a4.9 4.9 0 0 0 4.6 3.4A9.8 9.8 0 0 1 0 20.5a13.8 13.8 0 0 0 7.5 2.2c9 0 13.9-7.4 13.9-13.9v-.6c1-.7 1.8-1.5 2.1-2.5z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24"><path d="M10 15.5v-7a.5.5 0 0 1 .8-.4l4.7 3.5a.5.5 0 0 1 0 .8l-4.7 3.5a.5.5 0 0 1-.8-.4zM12 2A10 10 0 1 0 22 12 10 10 0 0 0 12 2z"/></svg>',
    behance: '<svg viewBox="0 0 24 24"><path d="M19 0H5a5 5 0 0 0-5 5v14a5 5 0 0 0 5 5h14a5 5 0 0 0 5-5V5a5 5 0 0 0-5-5zM8.4 18.2H5.5V9.2h2.9zM6.95 7.9a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4zM18.5 18.2h-2.9v-4.5c0-1-.6-1.7-1.5-1.7s-1.6.6-1.6 1.7v4.5H9.6V9.2h2.8v1.2a3 3 0 0 1 2.7-1.4c2 0 3.4 1.3 3.4 4z"/></svg>'
  };

  const body = document.body;
  const loginScreen = document.getElementById("loginScreen");
  const profile = document.getElementById("profile");
  const logoutBtn = document.getElementById("logoutBtn");
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const errorMsg = document.getElementById("errorMsg");

  const linksEl = document.getElementById("links");
  const addLinkBtn = document.getElementById("addLinkBtn");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalTitle = document.getElementById("modalTitle");
  const modalFields = document.getElementById("modalFields");
  const modalNote = document.getElementById("modalNote");
  const modalClose = document.getElementById("modalClose");
  const modalCancel = document.getElementById("modalCancel");
  const modalSave = document.getElementById("modalSave");
  const mLabel = document.getElementById("mLabel");
  const mUrl = document.getElementById("mUrl");
  const mIcon = document.getElementById("mIcon");

  const EDIT_SVG = '<svg viewBox="0 0 24 24"><path d="M3 17.3V21h3.7L17.8 9.9l-3.7-3.7L3 17.3zm16.7-10-2-2a1 1 0 0 0-1.4 0l-1.4 1.4 3.7 3.7 1.1-1.1a1 1 0 0 0 0-1.4z"/></svg>';
  const DEL_SVG = '<svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';

  let links = [];
  let editingId = null;
  let deleteId = null;

  function uid() {
    return "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function loadLinks() {
    try {
      const raw = localStorage.getItem(LINKS_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    localStorage.setItem(LINKS_KEY, JSON.stringify(DEFAULTS));
    return DEFAULTS.slice();
  }

  function saveLinks() {
    localStorage.setItem(LINKS_KEY, JSON.stringify(links));
  }

  function normalizeUrls(list) {
    let changed = false;
    list.forEach((l) => {
      if (!l.id) { l.id = uid(); changed = true; }
      if (!l.url) { l.url = "#"; changed = true; }
    });
    return list;
  }

  function setAuthed(state) {
    loginScreen.classList.toggle("hidden", state);
    profile.hidden = !state;
    logoutBtn.hidden = !state;
    body.classList.toggle("is-auth", state);
    addLinkBtn.hidden = !state;
  }

  function tryLogin() {
    const u = usernameInput.value.trim();
    const p = passwordInput.value;
    if (u === USERNAME && p === PASSWORD) {
      sessionStorage.setItem(SESSION_KEY, "true");
      errorMsg.classList.remove("show");
      usernameInput.value = "";
      passwordInput.value = "";
      setAuthed(true);
    } else {
      errorMsg.classList.add("show");
      passwordInput.value = "";
      passwordInput.focus();
    }
  }

  function linkRow(link) {
    const row = document.createElement("div");
    row.className = "link-row";

    const a = document.createElement("a");
    a.className = "link";
    a.href = link.url || "#";
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML =
      '<span class="icon">' + (ICONS[link.icon] || ICONS.link) + "</span>" +
      '<span class="label"></span>' +
      '<span class="arrow">&#8599;</span>';
    a.querySelector(".label").textContent = link.label;
    if (a.getAttribute("href") === "#") {
      a.addEventListener("click", (e) => e.preventDefault());
    }

    const actions = document.createElement("div");
    actions.className = "link-actions";

    const editBtn = document.createElement("button");
    editBtn.className = "edit";
    editBtn.title = "Edit link";
    editBtn.innerHTML = EDIT_SVG;

    const delBtn = document.createElement("button");
    delBtn.className = "del";
    delBtn.title = "Delete link";
    delBtn.innerHTML = DEL_SVG;

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    row.appendChild(a);
    row.appendChild(actions);

    editBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      openModal("edit", link);
    });

    delBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      openModal("delete", link);
    });

    return row;
  }

  function renderLinks() {
    linksEl.innerHTML = "";
    links.forEach((l) => linksEl.appendChild(linkRow(l)));
  }

  function openModal(mode, link) {
    if (mode === "add") {
      modalTitle.textContent = "Add link";
      modalFields.hidden = false;
      modalNote.hidden = true;
      mLabel.value = "";
      mUrl.value = "";
      mIcon.value = "link";
      editingId = null;
      deleteId = null;
      modalSave.textContent = "Add";
      modalSave.classList.remove("btn-danger");
      modalBackdrop.classList.add("open");
      mLabel.focus();
    } else if (mode === "edit") {
      modalTitle.textContent = "Edit link";
      modalFields.hidden = false;
      modalNote.hidden = true;
      mLabel.value = link.label;
      mUrl.value = link.url;
      mIcon.value = link.icon || "link";
      editingId = link.id;
      deleteId = null;
      modalSave.textContent = "Save";
      modalSave.classList.remove("btn-danger");
      modalBackdrop.classList.add("open");
      mLabel.focus();
    } else {
      modalTitle.textContent = "Delete link";
      modalFields.hidden = true;
      modalNote.hidden = false;
      modalNote.textContent = 'Remove "' + link.label + '"? This can\'t be undone.';
      editingId = null;
      deleteId = link.id;
      modalSave.textContent = "Delete";
      modalSave.classList.add("btn-danger");
      modalBackdrop.classList.add("open");
    }
  }

  function closeModal() {
    modalBackdrop.classList.remove("open");
    editingId = null;
    deleteId = null;
  }

  function saveModal() {
    if (deleteId !== null) {
      const i = links.findIndex((l) => l.id === deleteId);
      if (i !== -1) {
        links.splice(i, 1);
        saveLinks();
        renderLinks();
      }
      closeModal();
      return;
    }

    const label = mLabel.value.trim();
    const url = mUrl.value.trim();
    if (!label) { mLabel.focus(); return; }
    if (!url) { mUrl.focus(); return; }

    const href = /^https?:\/\//i.test(url) || url.startsWith("#") ? url : "https://" + url;

    if (editingId !== null) {
      const i = links.findIndex((l) => l.id === editingId);
      if (i !== -1) {
        links[i] = { ...links[i], label: label, url: href, icon: mIcon.value };
        saveLinks();
        renderLinks();
      }
    } else {
      links.push({ id: uid(), label: label, url: href, icon: mIcon.value });
      saveLinks();
      renderLinks();
    }
    closeModal();
  }

  loginBtn.addEventListener("click", tryLogin);
  [usernameInput, passwordInput].forEach((el) => {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
  });

  logoutBtn.addEventListener("click", () => {
    sessionStorage.removeItem(SESSION_KEY);
    setAuthed(false);
  });

  addLinkBtn.addEventListener("click", () => openModal("add"));
  modalClose.addEventListener("click", closeModal);
  modalCancel.addEventListener("click", closeModal);
  modalSave.addEventListener("click", saveModal);
  modalBackdrop.addEventListener("click", (e) => {
    if (e.target === modalBackdrop) closeModal();
  });
  [mLabel, mUrl, mIcon].forEach((el) => {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") saveModal(); });
  });

  links = normalizeUrls(loadLinks());
  saveLinks();
  renderLinks();

  if (sessionStorage.getItem(SESSION_KEY) === "true") {
    setAuthed(true);
  }
</script>
</body>
</html>
